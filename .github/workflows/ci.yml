name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (core + dev)
        run: pip install -e '.[dev]'

      - name: Ruff
        run: ruff check pixel_curator

      - name: Pytest (with coverage floor - ratchet up as coverage grows)
        run: >
          python -m pytest
          --cov=pixel_curator
          --cov-report=term-missing
          --cov-fail-under=8

      - name: CLI smoke
        run: |
          pixel-curator --help > /dev/null
          pixel-curator selftest
